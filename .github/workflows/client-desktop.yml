name: Desktop client

on:
  push:
    paths:
      - 'client/**'
      - 'server/**'
      - '.github/workflows/client-desktop.yml'
  pull_request:
    paths:
      - 'client/**'
      - 'server/**'
      - '.github/workflows/client-desktop.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-2025
          - platform: linux
            runner: ubuntu-24.04
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux toolchain
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev libasound2t64 ffmpeg
      - name: Set up Go
        if: matrix.platform == 'linux'
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Run server tests
        if: matrix.platform == 'linux'
        working-directory: server
        run: go test -mod=readonly -count=1 ./...
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
          pub-cache: false
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Analyze Dart code
        if: matrix.platform == 'linux'
        run: flutter analyze --no-pub lib
      - name: Build desktop client
        run: flutter build ${{ matrix.platform }} --release --no-pub
