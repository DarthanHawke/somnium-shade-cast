basePath: /
definitions:
  dto.SuccessResponse:
    properties:
      message:
        type: string
    type: object
  dto.UserRequest:
    properties:
      display_name:
        type: string
      name:
        type: string
    type: object
  dto.UserResponse:
    properties:
      created_at:
        type: integer
      display_name:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      public_id:
        type: string
      role:
        type: string
    type: object
  respond.ErrorBody:
    properties:
      error:
        type: string
      field:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: API Somnium Shade Cast
  title: Somnium Shade Cast API
  version: "1.0"
paths:
  /users:
    post:
      consumes:
      - application/json
      description: Создаёт нового пользователя с указанными данными
      parameters:
      - description: Данные пользователя
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Пользователь создан
          schema:
            $ref: '#/definitions/dto.UserResponse'
        "400":
          description: Невалидный JSON или поля
          schema:
            $ref: '#/definitions/respond.ErrorBody'
        "409":
          description: Пользователь уже существует
          schema:
            $ref: '#/definitions/respond.ErrorBody'
        "500":
          description: Внутренняя ошибка
          schema:
            $ref: '#/definitions/respond.ErrorBody'
      security:
      - DevAuth: []
      summary: Создать пользователя
      tags:
      - Users
  /users/{publicID}:
    get:
      description: Возвращает информацию о пользователе по его ID
      parameters:
      - description: ID пользователя
        in: path
        name: publicID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Пользователь найден
          schema:
            $ref: '#/definitions/dto.UserResponse'
        "400":
          description: Неверный ID
          schema:
            $ref: '#/definitions/respond.ErrorBody'
        "404":
          description: Пользователь не найден
          schema:
            $ref: '#/definitions/respond.ErrorBody'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/respond.ErrorBody'
      security:
      - DevAuth: []
      summary: Получить пользователя
      tags:
      - Users
  /users/{publicID}/activate:
    post:
      parameters:
      - description: ID пользователя
        in: path
        name: publicID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Пользователь активирован
          schema:
            $ref: '#/definitions/dto.SuccessResponse'
        "400":
          description: Неверный ID
          schema:
            $ref: '#/definitions/respond.ErrorBody'
        "404":
          description: Пользователь не найден
          schema:
            $ref: '#/definitions/respond.ErrorBody'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/respond.ErrorBody'
      security:
      - DevAuth: []
      summary: Активировать пользователя
      tags:
      - Users
  /users/{publicID}/deactivate:
    post:
      parameters:
      - description: ID пользователя
        in: path
        name: publicID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Пользователь деактивирован
          schema:
            $ref: '#/definitions/dto.SuccessResponse'
        "400":
          description: Неверный ID
          schema:
            $ref: '#/definitions/respond.ErrorBody'
        "404":
          description: Пользователь не найден
          schema:
            $ref: '#/definitions/respond.ErrorBody'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/respond.ErrorBody'
      security:
      - DevAuth: []
      summary: Деактивировать пользователя
      tags:
      - Users
securityDefinitions:
  DevAuth:
    description: Публичный ULID активного пользователя для локального режима разработки.
    in: header
    name: X-User
    type: apiKey
swagger: "2.0"
